<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NES Emulator</title>
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="stylesheet" href="app.css" />
    <script>
      let darkMode = !!JSON.parse(localStorage.getItem('darkMode'));
      document.documentElement.classList.toggle('dark', darkMode);
    </script>
  </head>
  <body>
    <div class="container">
      <div class="panel">
        <div class="ctrl" title="Choose file">
          <svg viewBox="0 0 24 24">
            <path
              fill-rule="evenodd"
              clip-rule="evenodd"
              d="M1 5C1 3.34315 2.34315 2 4 2H8.55848C9.84977 2 10.9962 2.82629 11.4045 4.05132L11.7208 5H20C21.1046 5 22 5.89543 22 7V9.00961C23.1475 9.12163 23.9808 10.196 23.7695 11.3578L22.1332 20.3578C21.9603 21.3087 21.132 22 20.1654 22H3C1.89543 22 1 21.1046 1 20V5ZM20 9V7H11.7208C10.8599 7 10.0956 6.44914 9.82339 5.63246L9.50716 4.68377C9.37105 4.27543 8.98891 4 8.55848 4H4C3.44772 4 3 4.44772 3 5V12.2709L3.35429 10.588C3.54913 9.66249 4.36562 9 5.31139 9H20ZM3.36634 20C3.41777 19.9109 3.4562 19.8122 3.47855 19.706L5.31139 11L21 11H21.8018L20.1654 20L3.36634 20Z"
              fill="#ffffff"
            />
          </svg>
          <label>
            <input class="file" type="file" accept=".nes" />
          </label>
        </div>
        <button type="button" class="ctrl ctrl-reset" title="Reset (r)">
          <svg viewBox="0 0 24 24">
            <path
              d="M21 3V8M21 8H16M21 8L18 5.29168C16.4077 3.86656 14.3051 3 12 3C7.02944 3 3 7.02944 3 12C3 16.9706 7.02944 21 12 21C16.2832 21 19.8675 18.008 20.777 14"
              stroke="#ffffff"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
        <button type="button" class="ctrl ctrl-keys" title="Controls">
          <svg viewBox="0 0 512 512">
            <path
              d="M473.759,107.286c-19.12-31.867-53.112-53.112-91.353-53.112H127.469c-38.241,0-72.232,21.245-91.353,53.112  C12.747,149.776,0,196.515,0,245.378c0,116.846,46.739,212.448,106.224,212.448c31.867,0,57.361-29.743,76.481-91.353  c2.124-8.498,10.622-14.871,21.245-14.871h104.1c8.498,0,16.996,6.373,21.245,14.871c19.12,61.61,44.614,91.353,76.481,91.353  c59.485,0,106.224-95.602,106.224-212.448C509.876,196.515,497.129,149.776,473.759,107.286z M403.651,415.336  c-6.373,0-21.245-16.996-36.116-61.61c-8.498-27.618-33.992-44.614-61.61-44.614H203.95c-27.618,0-53.112,19.12-61.61,44.614  c-14.871,44.614-29.743,61.61-36.116,61.61c-21.245,0-63.734-65.859-63.734-169.958c0-40.365,10.622-80.73,29.743-116.846  c12.747-19.12,33.992-31.867,55.237-31.867h254.938c21.245,0,42.49,12.747,55.237,31.867c19.12,36.116,29.743,76.481,29.743,116.846  C467.386,349.477,424.896,415.336,403.651,415.336z"
              fill="#ffffff"
            />
            <path
              d="M192,192h-21.333v-21.333c0-12.8-8.533-21.333-21.333-21.333c-12.8,0-21.333,8.533-21.333,21.333V192h-21.333  c-12.8,0-21.333,8.533-21.333,21.333c0,12.8,8.533,21.333,21.333,21.333H128V256c0,12.8,8.533,21.333,21.333,21.333  c12.8,0,21.333-8.533,21.333-21.333v-21.333H192c12.8,0,21.333-8.533,21.333-21.333C213.333,200.533,204.8,192,192,192z"
              fill="#ffffff"
            />
            <circle cx="394.667" cy="181.333" r="32" fill="#ffffff" />
            <circle cx="330.667" cy="245.333" r="32" fill="#ffffff" />
          </svg>
        </button>
        <button type="button" class="ctrl ctrl-mode" title="Switch mode">
          <svg viewBox="0 0 24 24">
            <path
              d="M0,9c0-.552,.448-1,1-1H3.108c.147-.874,.472-1.721,1.006-2.471l-1.478-1.478c-.391-.391-.391-1.023,0-1.414s1.023-.391,1.414,0l1.478,1.478c.751-.534,1.598-.859,2.471-1.006V1c0-.552,.448-1,1-1s1,.448,1,1V3.108c.874,.147,1.725,.466,2.477,1.001l1.473-1.473c.391-.391,1.023-.391,1.414,0s.391,1.023,0,1.414l-2.121,2.121c-.391,.391-1.023,.391-1.414,0-1.56-1.56-4.098-1.56-5.657,0s-1.56,4.098,0,5.657c.188,.188,.293,.442,.293,.707s-.105,.52-.293,.708l-2.208,2.207c-.195,.195-.451,.293-.707,.293s-.512-.098-.707-.293c-.391-.391-.391-1.023,0-1.414l1.56-1.56c-.535-.751-.854-1.602-1.001-2.477H1c-.552,0-1-.448-1-1ZM23.707,.293c-.391-.391-1.023-.391-1.414,0L.293,22.293c-.391,.391-.391,1.023,0,1.414,.195,.195,.451,.293,.707,.293s.512-.098,.707-.293L23.707,1.707c.391-.391,.391-1.023,0-1.414Zm-.283,10.954c.32-.15,.538-.458,.572-.811,.034-.352-.121-.696-.408-.904-1.017-.739-2.203-1.234-3.429-1.432-.541-.09-1.059,.283-1.146,.829-.088,.545,.283,1.058,.829,1.146,.41,.066,.813,.176,1.203,.328-1.65,1.36-2.653,3.41-2.653,5.597s1.003,4.238,2.655,5.598c-.683,.266-1.41,.402-2.155,.402-2.967,0-5.52-2.21-5.939-5.142-.078-.547-.586-.924-1.131-.849-.547,.078-.927,.585-.848,1.132,.559,3.91,3.964,6.858,7.919,6.858,1.695,0,3.32-.53,4.697-1.533,.286-.208,.441-.553,.407-.904-.034-.353-.251-.66-.572-.811-1.842-.861-3.033-2.727-3.033-4.752s1.19-3.891,3.033-4.753Z"
              fill="#ffffff"
            />
          </svg>
        </button>
      </div>

      <canvas class="screen" width="256" height="240"></canvas>

      <div class="intro">
        <h1>NES<br />Emulator</h1>
        <div class="btn">
          Choose file
          <label>
            <input class="file" type="file" accept=".nes" />
          </label>
        </div>
      </div>

      <div class="controls hidden">
        <div class="controls-inner">
          <div class="controls-row">
            <div class="controls-col">START</div>
            <div class="controls-col">-</div>
            <div class="controls-col">Enter</div>
          </div>
          <div class="controls-row">
            <div class="controls-col">SELECT</div>
            <div class="controls-col">-</div>
            <div class="controls-col">Space</div>
          </div>
          <div class="controls-row">
            <div class="controls-col">Left</div>
            <div class="controls-col">-</div>
            <div class="controls-col">Arrow left</div>
          </div>
          <div class="controls-row">
            <div class="controls-col">Right</div>
            <div class="controls-col">-</div>
            <div class="controls-col">Arrow right</div>
          </div>
          <div class="controls-row">
            <div class="controls-col">Up</div>
            <div class="controls-col">-</div>
            <div class="controls-col">Arrow up</div>
          </div>
          <div class="controls-row">
            <div class="controls-col">Down</div>
            <div class="controls-col">-</div>
            <div class="controls-col">Arrow down</div>
          </div>
          <div class="controls-row">
            <div class="controls-col">A</div>
            <div class="controls-col">-</div>
            <div class="controls-col">Z</div>
          </div>
          <div class="controls-row">
            <div class="controls-col">B</div>
            <div class="controls-col">-</div>
            <div class="controls-col">X</div>
          </div>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
